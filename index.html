function base(){const g=new THREE.Group();const d=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.015,0.003,24),flat(0x4a4458,0.6));d.position.y=0.0015;d.castShadow=true;d.receiveShadow=true;g.add(d);
 // aluminium-foil tabs (Gunpla foil sticker), wrapped from top face over the edge: front (+Z) and back (-Z)
 for(const fz of [0,Math.PI]){const foil=MARK, W=0.0016, L=0.0045, R=0.01503;
  const t=new THREE.Group();t.rotation.y=fz;g.add(t);
  const top=new THREE.Mesh(new THREE.PlaneGeometry(W,L),foil);top.rotation.x=-Math.PI/2;top.position.set(0,0.00303,R-L/2);t.add(top);
  const side=new THREE.Mesh(new THREE.PlaneGeometry(W,0.0026),foil);side.position.set(0,0.0017,R);t.add(side);}
 return g;}
const loader=new GLTFLoader();
function mini(url,pos,rot){const g=new THREE.Group();g.add(base());g.position.set(...pos);g.rotation.y=rot;scene.add(g);
 loader.load(url,gl=>{gl.scene.traverse(m=>{if(m.isMesh){m.material=new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:0.62,flatShading:true,sheen:0.6,sheenRoughness:0.5,sheenColor:new THREE.Color(0xffffff),clearcoat:0.15,clearcoatRoughness:0.6});m.castShadow=true;m.receiveShadow=true;}});g.add(gl.scene);window.__loaded=(window.__loaded||0)+1;});}

const TL=new THREE.TextureLoader();
const sideMat=new THREE.MeshStandardMaterial({color:0x3b3b42,roughness:0.9});
function cardTex(url,w,h,mirror){const t=TL.load(url);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping;
 t.repeat.set((mirror?-1:1)/w,1/h);t.offset.set(mirror?1:0,0);return t;}
function makeCard(name){
 const P=PIECES[name], s=0.001, w=P.w*s, h=P.h*s, T=0.0005;
 const shape=new THREE.Shape(P.shape.map(([x,y])=>new THREE.Vector2(x*s,y*s)));
 const ex=new THREE.ExtrudeGeometry(shape,{depth:T,bevelEnabled:false});
 const front=new THREE.MeshStandardMaterial({map:cardTex(P.front,w,h,false),roughness:0.75});
 const top=new THREE.Mesh(ex,[front,sideMat]); top.castShadow=true; top.receiveShadow=true;
 const back=new THREE.Mesh(new THREE.ShapeGeometry(shape),new THREE.MeshStandardMaterial({map:cardTex(P.back,w,h,true),roughness:0.75,side:THREE.BackSide}));
 back.position.z=-0.00004; back.receiveShadow=true;
 const g=new THREE.Group(); g.add(top,back); g.position.set(-w/2,-h/2,0);           // centre the card
 return {g,T};
}
// place a card flat on the table: rotY = heading of the card's "up" (image top) direction; flip = show the back side
function placeCard(name,x,z,rotY,flip=false,lift=0){
 const {g,T}=makeCard(name);
 const flipG=new THREE.Group(); flipG.add(g); if(flip) flipG.rotation.y=Math.PI;
 const lay=new THREE.Group(); lay.add(flipG); lay.rotation.x=-Math.PI/2;
 const outer=new THREE.Group(); outer.add(lay); outer.rotation.y=rotY; outer.position.set(x,0.0007+lift+(flip?T:0),z);
 scene.add(outer); return outer;
}
// a simple paper clip
function paperClip(x,z,rotY){
 const pts=[[0,0],[0.020,0],[0.022,0.0035],[0.020,0.007],[-0.002,0.007],[-0.004,0.0045],[-0.002,0.0015],[0.016,0.0015],[0.0175,0.0035],[0.016,0.0055],[0.002,0.0055]];
 const curve=new THREE.CatmullRomCurve3(pts.map(([a,b])=>new THREE.Vector3(a,0,b)),false,'catmullrom',0.2);
 const m=new THREE.Mesh(new THREE.TubeGeometry(curve,80,0.00045,6,false),new THREE.MeshStandardMaterial({color:0xc9ced6,metalness:0.85,roughness:0.3}));
 m.castShadow=true; const g=new THREE.Group(); g.add(m); g.position.set(x,0.0016,z); g.rotation.y=rotY; scene.add(g); return g;
}
// table-side props (east side, away from the phone light)
placeCard('round',0.275,0.0,Math.PI/2);
placeCard('plot',0.205,-0.175,-0.35);  placeCard('fudo',0.255,-0.125,-0.2);
placeCard('plot',0.205,0.175,Math.PI+0.35); placeCard('fudo',0.255,0.125,Math.PI+0.2,true);    // rabbit has used Fudō (grey side up)
placeCard('bank45',0.34,-0.09,0.25); placeCard('turn90',0.35,0.08,-0.3,true);                    // spare templates, the 90° flipped
paperClip(0.196,-0.192,-0.35+Math.PI/2); paperClip(0.214,-0.158,-0.35);
paperClip(0.275-0.004,-0.012,Math.PI/2);

  if(G.plans&&G.plansRound===G.round)t+=`<br><span class="plan">電腦規劃：${pl(G.plans[A][0])} → ${pl(G.plans[A][1])}</span>`;
  if(extra)t+=`<br><span class="ex">${extra}</span>`;top.innerHTML=t;}
function waitClick(map){return new Promise(res=>{for(const [id,v] of Object.entries(map)){const b=document.getElementById(id);if(b)b.onclick=()=>res(v);}});}
const RES_TXT={out:'出界 → 輸',hit:'撞到對手 → 輸',tpl:'模板碰到對手底座 → 輸',shadow:'踩到影子 → 贏！',ok:'安全'};
const RES_COL={out:0xe25b4b,hit:0xe25b4b,tpl:0xe25b4b,shadow:0xf2c14e,ok:0x7be38a};
// ---------- game state ----------
const G=window.G={human:0,P:null,fudo:[true,true],round:0,active:0,level:'normal',over:false,log:[]};
function startPoses(fr,rr){return [{x:0,z:-CORNER,r:0+fr},{x:0,z:CORNER,r:Math.PI+rr}];}
async function setup(){
  G.over=false;G.round=0;G.plans=null;G.fudo=[true,true];G.log=[];ring.visible=ghost.visible=false;
  let first='me',face=0;
  const render=()=>{G.P=startPoses(G.human===0?face:0,G.human===1?face:0);setPose(0,G.P[0]);setPose(1,G.P[1]);camHome();drawTop('開局設定');
    h(`<div class="row"><span class="lbl">你用</span><button id="c0" class="${G.human===0?'on':''}">青蛙</button><button id="c1" class="${G.human===1?'on':''}">兔子</button>
      <span class="lbl">難度</span><button id="l1" class="${G.level==='easy'?'on':''}">簡單</button><button id="l2" class="${G.level==='normal'?'on':''}">普通</button><button id="l3" class="${G.level==='hard'?'on':''}">困難</button></div>
    <div class="row"><span class="lbl">先手</span><button id="f1" class="${first==='me'?'on':''}">我先</button><button id="f2" class="${first==='ai'?'on':''}">電腦先</button><button id="f3" class="${first==='rnd'?'on':''}">隨機</button></div>
    <div class="row"><span class="lbl">面向</span><input id="face" type="range" min="-90" max="90" value="${Math.round(-face*180/Math.PI)}"><span id="fv">${Math.round(-face*180/Math.PI)}°</span><button id="go" class="go">開始</button></div>`);
    document.getElementById('face').oninput=e=>{face=-e.target.value*Math.PI/180;document.getElementById('fv').textContent=e.target.value+'°';G.P=startPoses(G.human===0?face:0,G.human===1?face:0);setPose(0,G.P[0]);setPose(1,G.P[1]);};};
  render();
  for(;;){const v=await waitClick({c0:'c0',c1:'c1',f1:'me',f2:'ai',f3:'rnd',l1:'easy',l2:'normal',l3:'hard',go:'go'});
    if(v==='c0'||v==='c1'){G.human=v==='c0'?0:1;face=0;}else if(['me','ai','rnd'].includes(v))first=v;else if(['easy','normal','hard'].includes(v))G.level=v;else break;render();}
  const ai=1-G.human,aiFace=(Math.random()*2-1)*Math.PI/6;
  G.P=startPoses(G.human===0?face:aiFace,G.human===1?face:aiFace);setPose(0,G.P[0]);setPose(1,G.P[1]);
  G.active=first==='me'?G.human:first==='ai'?ai:(Math.random()<.5?0:1);
  return play();}
async function play(){const H=G.human,A=1-H;
  for(G.round=1;G.round<=6;G.round++){
    if(G.round>1){const dh=lightDist(G.P[H]),da=lightDist(G.P[A]);if(Math.abs(dh-da)<0.0001)G.active=1-G.active;else G.active=dh<da?H:A;}
    drawTop();
    // --- secret plotting ---
    let p1=null,p2=null;
    const SH={S:'直線',L45:'左45°',R45:'右45°',L90:'左90°',R90:'右90°',U:'迴轉'};
    const mvb=(id,k,on,dis)=>`<button id="${id}" class="mv ${on?'on':''}" ${dis?'disabled':''}><b>${KIND[k].ic}</b><small>${SH[k]}</small></button>`;
    for(;;){h(`<div class="plot"><span class="lbl">第1步</span><div class="mvs">${MOVES.map(k=>mvb('a_'+k,k,p1===k,false)).join('')}</div>
      <button id="ok" class="go" ${p1&&p2?'':'disabled'}>確定<br>規劃</button>
      <span class="lbl">第2步</span><div class="mvs">${[...MOVES,'U'].map(k=>mvb('b_'+k,k,p2===k,k==='U'&&p1!=='S')).join('')}</div></div>`);
      const m={ok:'ok'};MOVES.forEach(k=>{m['a_'+k]='a'+k;});[...MOVES,'U'].forEach(k=>{m['b_'+k]='b'+k;});
      const v=G.autoHuman?'ok':await waitClick(m);
      if(G.autoHuman){[p1,p2]=G.autoHuman(G);break;}
      if(v==='ok')break;if(v[0]==='a'){p1=v.slice(1);if(p2==='U'&&p1!=='S')p2=null;}else p2=v.slice(1);}
    h('<div>電腦思考中…</div>');await sleep(60);
    const t0=performance.now();const aip=aiPlan(G.P,A,G.active,G.level);G.thinkMs=performance.now()-t0;
    const plans=[];plans[H]=[p1,p2];plans[A]=aip;G.plans=plans;
    G.plansRound=G.round;drawTop('雙方規劃已公開');h('<div class="ttl">規劃公開！</div>');await sleep(700);
    for(let k=0;k<2&&!G.over;k++)for(const m of [G.active,1-G.active]){if(G.over)break;await doStep(m,k,plans[m][k]);}
    if(G.over)return;}
  // --- time up ---
  const dh=lightDist(G.P[H]),da=lightDist(G.P[A]);let w;
  if(Math.abs(dh-da)<0.0001){w=G.fudo[H]&&!G.fudo[A]?H:G.fudo[A]&&!G.fudo[H]?A:-1;}else w=dh<da?H:A;
  end(w,`6 回合結束：你 ${fmt(dh)}、電腦 ${fmt(da)}${Math.abs(dh-da)<0.0001?'（同距離，比不動）':''}`);}
async function doStep(m,k,kind){const H=G.human,who=m===H?'你':'電腦';drawTop(`第 ${k+1} 步・${who}：${KIND[kind].label}`);
  const from={...G.P[m]};let useFudo=false;
  if(m===H){
    if(G.autoHuman)useFudo=false;else{
    h(`<div class="ttl"><b>你的第 ${k+1} 步：${pl(kind)}</b> <span class="hint">（不動要在放模板前宣告）</span></div>
      <div class="row"><button id="go" class="go">${kind==='U'?'原地轉 180°':'放下模板'}</button><button id="fd" class="fudo" ${G.fudo[H]?'':'disabled'}>🪷 使用不動</button></div>`);
    useFudo=(await waitClick({go:false,fd:true}));}
  }else{
    const b=bestLanding(G.P,m,kind,kind==='U'?1:13);
    if(G.fudo[m]&&LOSE(b.res))useFudo=true;
    h(`<div class="ttl">電腦的第 ${k+1} 步：${pl(kind)}${useFudo?'… <b>使用不動！</b>':''}</div>`);await sleep(700);
    if(!useFudo){G.aiPick=b;}}
  if(useFudo){G.fudo[m]=false;G.log.push([G.round,m,k,kind,'fudo']);drawTop(`${who}使用了「不動」，這一步取消`);await sleep(900);return;}
  let np,res;
  if(kind==='U'){np={...from,r:from.r+Math.PI};await animPose(m,from,np,600);res=judge(G.P,m,np,kind);}
  else{const tm=tplMesh(from,kind);ghost.position.x=from.x;ghost.position.z=from.z;ghost.visible=true;await sleep(450);
    if(m===H&&!G.autoHuman){
      let t=0.5;const upd=()=>{np=landing(from,kind,t);res=judge(G.P,m,np,kind);setPose(m,np);actors[m].g.position.y=HOV;ring.position.x=np.x;ring.position.z=np.z;ringMat.color.setHex(RES_COL[res]);ring.visible=true;
        const st=document.getElementById('st');if(st){st.textContent=RES_TXT[res];st.style.color='#'+RES_COL[res].toString(16).padStart(6,'0');}};
      await carry(m,from,landing(from,kind,t),false,600);
      h(`<div class="row"><span class="hint">◀ 左</span><input id="sl" type="range" min="0" max="100" value="50"><span class="hint">右 ▶</span></div>
        <div class="row"><span>落點判定：<span id="st"></span></span><button id="ok" class="go">確定落點</button></div>`);
      upd();document.getElementById('sl').oninput=e=>{t=e.target.value/100;upd();};
      await waitClick({ok:1});await putDown(m,np);
    }else{const b=m===H?bestLanding(G.P,m,kind,9):G.aiPick;np=b.p;res=b.res;await carry(m,from,np,true,820);
      ring.position.x=np.x;ring.position.z=np.z;ringMat.color.setHex(RES_COL[res]);ring.visible=true;await sleep(500);}
    scene.remove(tm);}
  ghost.visible=false;
  G.P[m]=np;setPose(m,np);G.log.push([G.round,m,k,kind,res]);
  if(LOSE(res)){end(1-m,`${who}${RES_TXT[res]}`);return;}
  if(res==='shadow'){end(m,`${who}踩到了對手的影子！`);return;}
  ring.visible=false;drawTop();await sleep(250);}
function end(w,why){G.over=true;G.winner=w;const H=G.human;drawTop();
  ring.visible=!!ring.visible;
  h(`<div class="ttl" style="font-size:20px"><b>${w===H?'🎉 你贏了':w===-1?'平手':'你輸了'}</b></div><div class="ttl">${why}</div><div class="row"><button id="again" class="go">再玩一次</button></div>`);
  if(G.onEnd)G.onEnd(w,why);
  waitClick({again:1}).then(()=>setup());}
Promise.all([loadMini(FROG),loadMini(RABBIT)]).then(([a,b])=>{actors[0]=a;actors[1]=b;MODELS[0]=a.model;MODELS[1]=b.model;window.__gameReady=true;{const L=document.getElementById('loading');if(L){const go=()=>{L.style.opacity='0';setTimeout(()=>L.remove(),650);};requestAnimationFrame(()=>requestAnimationFrame(go));}}if(location.search.includes('trailer')){top.style.display=panel.style.display=vbtn.style.display='none';}else setup();});
window.GAPI={actors,setPose,tplMesh,ring,ringMat,KIND,landing,judge,bestLanding,aiPlan,simRound,lightDist,PLANS,startPoses,MODELS,tplPoly,setup};

// ---------------- post-processing ----------------
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const ao=new GTAOPass(scene,cam,W,H); ao.updateGtaoMaterial({radius:0.012,distanceExponent:1.5,thickness:0.6,scale:1.0}); ao.blendIntensity=0.55; composer.addPass(ao);
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.08,0.5,0.98); composer.addPass(bloom);
const bokeh=new BokehPass(scene,cam,{focus:0.5,aperture:0.0016,maxblur:0.007}); composer.addPass(bokeh);
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},sat:{value:1.10},warm:{value:0.04},vig:{value:0.22}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
 fragmentShader:'uniform sampler2D tDiffuse;uniform float sat,warm,vig;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float l=dot(c.rgb,vec3(0.299,0.587,0.114));c.rgb=mix(vec3(l),c.rgb,sat);c.rgb+=vec3(warm,warm*0.4,-warm*0.6);float d=distance(vUv,vec2(0.5));c.rgb*=1.0-vig*smoothstep(0.35,0.85,d);gl_FragColor=c;}'});
composer.addPass(grade); composer.addPass(new OutputPass());
function updateFocus(){bokeh.uniforms.focus.value=cam.position.distanceTo(ctl.target);}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
const still=location.search.includes('still');
window.shot=()=>{ctl.update();updateFocus();composer.render();};
if(!still) renderer.setAnimationLoop(()=>{ctl.update();updateFocus();composer.render();});
window.cam=cam;window.ctl=ctl;window.__ready=true;
// ======================= TRAILER TIMELINE (?trailer) =======================
if(location.search.includes('trailer')){
const A=GAPI;
const base0={hemi:hemi.intensity,sun:sun.intensity,fill:fill.intensity,rim:rim.intensity,spot:spot.intensity};
const RAB={x:-0.035,z:0.015,r:Math.PI+0.35};
let FROG0={x:0.07,z:-0.10,r:0}, KIND_='S', TT=0.5;
window.findConfig=function(){const P=[null,null];P[1]=RAB;let best=null;
  for(let x=0.0;x<=0.14;x+=0.004)for(let z=-0.16;z<=-0.03;z+=0.004)for(const r of [-0.35,-0.2,0,0.2]){
    const f={x,z,r};P[0]=f;if(Math.hypot(x-RAB.x,z-RAB.z)<0.06)continue;
    for(const t of [0.5]){const np=A.landing(f,'S',t);const res=A.judge(P,0,np,'S');
      if(res!=='shadow')continue;
      // prefer: deep overlap (shadow under base centre) and start well outside shadow
      const S=shadowTrisFor(RAB);const deep=circleHitsShadow(np.x,np.z,0.006,S),startIn=circleHitsShadow(f.x,f.z,0.02,S);
      if(!deep||startIn)continue;const sc=-Math.abs(np.x-(RAB.x+0.07))-Math.abs(r)*0.02;
      if(!best||sc>best.sc)best={sc,f,np,t};}}
  return best;};
function shadowTrisFor(p){return shadowTris(p,MODELS[1]);}
// ---- easing / helpers ----
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),sm=(a,b,t)=>{t=cl((t-a)/(b-a));return t*t*(3-2*t);},lerp=(a,b,t)=>a+(b-a)*t;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
let tpl=null;
window.setupTrailer=function(cfg){if(cfg){FROG0=cfg.f;TT=cfg.t;}
  A.setPose(1,RAB);A.setPose(0,FROG0);
  tpl=A.tplMesh(FROG0,KIND_);tpl.userData.base=tpl.matrix.clone();
  const st=document.createElement('style');st.textContent='#top,#panel,#view{display:none!important}';document.head.appendChild(st);};
// ---- v2 timeline: 1.0 light on | 1.0-4.8 shadows stretch | 4.0-6.0 continuous dolly down | 5.5 template | 6.2 pick up | 7.9 put down ----
let camCurve=null,tgtCurve=null;const C0=0.8,C1=7.05;
function buildCam(){const L=landTarget();
  camCurve=new THREE.CatmullRomCurve3([V(0.31,0.43,0.37),V(0.26,0.30,0.32),V(0.215,0.13,0.20),V(0.19,0.072,0.145),V(0.168,0.056,0.122)],false,'centripetal');
  tgtCurve=new THREE.CatmullRomCurve3([V(0.02,0,0),V(0.02,0,0),V(L.x-0.02,0.003,L.z-0.02),V(L.x-0.028,0.006,L.z-0.026),V(L.x-0.02,0.008,L.z-0.015)],false,'centripetal');}
// one continuous move, constant-speed along the path (arc length), single gentle ease-in/out
function camAt(t){if(!camCurve)buildCam();const x=cl((t-C0)/(C1-C0));const u=0.5-0.5*Math.cos(Math.PI*x);
  return {p:camCurve.getPointAt(u),q:tgtCurve.getPoint(u)};}
let _land=null;function landTarget(){if(!_land)_land=A.landing(FROG0,KIND_,TT);return _land;}
window.T=function(t){
  const on=t>=0.8?1:0, amb=sm(0.8,2.6,t)*lerp(0.55,0.42,sm(3.5,5.5,t));
  spot.intensity=base0.spot*on*(t<0.92?0.55+0.45*Math.sin((t-0.8)*40)**2:1);glow.visible=!!on;
  hemi.intensity=base0.hemi*amb;sun.intensity=base0.sun*amb*0.6;fill.intensity=base0.fill*amb;rim.intensity=base0.rim*amb;
  const hy=lerp(0.30,0.13,sm(0.8,4.2,t));spot.position.y=hy;glow.position.y=hy;
  const drop=sm(4.9,5.25,t);tpl.visible=t>=4.9;
  if(tpl.visible){const m=tpl.userData.base.clone();m.elements[13]+=(1-drop)*0.03;tpl.matrix.copy(m);}
  const L=landTarget();let dr=L.r-FROG0.r;dr=Math.atan2(Math.sin(dr),Math.cos(dr));
  const up=sm(5.45,5.75,t), mv=sm(5.75,6.6,t), down=sm(6.6,6.9,t), lift=0.028*(up-down);
  A.setPose(0,{x:lerp(FROG0.x,L.x,mv),z:lerp(FROG0.z,L.z,mv),r:FROG0.r+dr*mv});
  A.actors[0].g.position.y=lift;A.actors[0].g.rotation.z=0.06*Math.sin(Math.PI*mv)*(up-down);
  A.ring.visible=t>=6.9;A.ringMat.color.setHex(0xf2c14e);A.ring.position.x=L.x;A.ring.position.z=L.z;A.ringMat.opacity=0.95;
  const c=camAt(t);cam.position.copy(c.p);cam.lookAt(c.q);
  bokeh.uniforms.focus.value=cam.position.distanceTo(c.q);
  bokeh.uniforms.aperture.value=lerp(0.0016,0.0035,sm(3.0,6.0,t));
  composer.render();return true;};
window.__trailerReady=true;}
